<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カオスゼロナイトメア 英日用語対応表</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%97%92%EF%B8%8F</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f6f7f9;
    --fg: #1b1d21;
    --fg-dim: #5c6169;
    --border: #dfe2e7;
    --accent: #2f6fdb;
    --ok-bg: #e3f4e8;   --ok-fg: #17683a;   --ok-bd: #a9d9bc;
    --guess-bg: #fdf1d9; --guess-fg: #8a5a06; --guess-bd: #e8ca8a;
    --un-bg: #eceef1;   --un-fg: #545a63;   --un-bd: #cdd2da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --bg-alt: #1c1f25;
      --fg: #e6e8ec;
      --fg-dim: #9aa1ac;
      --border: #2d323a;
      --accent: #74a6f5;
      --ok-bg: #16311f;   --ok-fg: #7fd4a0;   --ok-bd: #2c5e3d;
      --guess-bg: #33270f; --guess-fg: #e8bd6b; --guess-bd: #5d4720;
      --un-bg: #23262c;   --un-fg: #99a0aa;   --un-bd: #3a3f48;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1rem 3rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  h1 { font-size: 1.3rem; margin: 1.5rem 0 .25rem; }
  .sub { color: var(--fg-dim); font-size: .85rem; margin: 0 0 1rem; }
  .sub a { color: var(--accent); }

  /* 検索バーは縦スクロール中も張り付かせる */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: .75rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: .75rem;
  }
  #q {
    width: 100%;
    padding: .7rem .85rem;
    font-size: 1rem;
    color: var(--fg);
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .chip {
    font: inherit; font-size: .8rem;
    padding: .3rem .7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-alt);
    color: var(--fg-dim);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .count { color: var(--fg-dim); font-size: .8rem; margin: .5rem 0 0; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: .75rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--fg-dim);
    padding: .5rem .6rem; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: .6rem; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: var(--bg-alt); }
  .en { font-weight: 600; }
  .empty { color: var(--fg-dim); font-style: italic; }
  .note { display: block; color: var(--fg-dim); font-size: .8rem; margin-top: .3rem; }
  .src a { color: var(--accent); font-size: .8rem; overflow-wrap: anywhere; }

  .tag {
    display: inline-block; font-size: .72rem; font-weight: 600;
    padding: .15rem .5rem; border-radius: 4px; white-space: nowrap;
    border: 1px solid;
  }
  .tag.confirmed { background: var(--ok-bg);    color: var(--ok-fg);    border-color: var(--ok-bd); }
  .tag.guess     { background: var(--guess-bg); color: var(--guess-fg); border-color: var(--guess-bd); }
  .tag.unmatched { background: var(--un-bg);    color: var(--un-fg);    border-color: var(--un-bd); }

  mark { background: #ffe9a8; color: #000; border-radius: 2px; padding: 0 1px; }
  @media (prefers-color-scheme: dark) { mark { background: #6b5518; color: #fff; } }

  .msg { padding: 1rem; background: var(--bg-alt); border: 1px solid var(--border);
         border-radius: 8px; color: var(--fg-dim); font-size: .9rem; }
  .msg code { font-size: .85em; }

  /* 広い画面では確度・出典を折り返さず、余った幅を用語側に回す */
  @media (min-width: 641px) {
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td.src { width: 1%; white-space: nowrap; }
  }

  /* スマホ縦画面: 表を1件1カードに組み替える */
  @media (max-width: 640px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      border: 1px solid var(--border); border-radius: 8px;
      padding: .6rem .75rem; margin-bottom: .6rem; background: var(--bg-alt);
    }
    tbody tr:nth-child(even) { background: var(--bg-alt); }
    tbody td { border: none; padding: .15rem 0; }
    td[data-label]::before {
      content: attr(data-label);
      display: inline-block; min-width: 5.5em;
      color: var(--fg-dim); font-size: .75rem;
    }
    .en, .ja { font-size: 1.05rem; }
    td.src { padding-top: .4rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>カオスゼロナイトメア 英日用語対応表</h1>
  <p class="sub" id="meta"></p>

  <div class="controls">
    <input id="q" type="search" placeholder="英語・日本語で検索（部分一致）"
           autocomplete="off" aria-label="用語を検索">
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
  </div>

  <div id="out"></div>
</div>

<script>
(function () {
  var out = document.getElementById('out');
  var qEl = document.getElementById('q');
  var countEl = document.getElementById('count');
  var chipsEl = document.getElementById('chips');
  var metaEl = document.getElementById('meta');

  var LEVELS = ['confirmed', 'guess', 'unmatched'];
  var entries = [];
  var active = {};                       // 空 = 絞り込みなし

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
               '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 一致箇所をハイライト。q が空なら素通し
  function hl(text, q) {
    if (!text) return '';
    if (!q) return esc(text);
    var lo = text.toLowerCase(), needle = q.toLowerCase(), o = '', i = 0, at;
    while ((at = lo.indexOf(needle, i)) !== -1) {
      o += esc(text.slice(i, at)) + '<mark>' +
           esc(text.slice(at, at + needle.length)) + '</mark>';
      i = at + needle.length;
    }
    return o + esc(text.slice(i));
  }

  // 出典 URL は長いので「ホスト / 末尾セグメント」に縮めて出す。全体は title 属性に残す
  function shortSource(url) {
    try {
      var u = new URL(url);
      var seg = u.pathname.split('/').filter(Boolean).pop() || '';
      var host = u.hostname.replace(/^www\./, '');
      return seg ? host + ' / ' + seg : host;
    } catch (err) {
      return url;
    }
  }

  function matches(e, q) {
    if (active.on && !active[e.confidence]) return false;
    if (!q) return true;
    q = q.toLowerCase();
    return (e.en && e.en.toLowerCase().indexOf(q) !== -1) ||
           (e.ja && e.ja.toLowerCase().indexOf(q) !== -1);
  }

  function render() {
    var q = qEl.value.trim();
    var rows = entries.filter(function (e) { return matches(e, q); });

    countEl.textContent = rows.length === entries.length
      ? entries.length + ' 件'
      : rows.length + ' / ' + entries.length + ' 件';

    if (!rows.length) {
      out.innerHTML = '<p class="msg">該当する用語がありません。</p>';
      return;
    }

    var html = '<table><thead><tr>' +
      '<th>English</th><th>日本語</th><th>確度</th><th>出典</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function (e) {
      var en = e.en ? '<span class="en">' + hl(e.en, q) + '</span>'
                    : '<span class="empty">未特定</span>';
      var ja = e.ja ? '<span class="ja">' + hl(e.ja, q) + '</span>'
                    : '<span class="empty">未特定</span>';
      var note = e.note ? '<span class="note">' + esc(e.note) + '</span>' : '';
      var src = e.source && /^https?:/.test(e.source)
        ? '<a href="' + esc(e.source) + '" target="_blank" rel="noopener"' +
          ' title="' + esc(e.source) + '">' + esc(shortSource(e.source)) + '</a>'
        : '<span class="empty">' + esc(e.source || '—') + '</span>';

      html += '<tr>' +
        '<td data-label="English">' + en + '</td>' +
        '<td data-label="日本語">' + ja + note + '</td>' +
        '<td data-label="確度"><span class="tag ' + esc(e.confidence) + '">' +
          esc(e.confidence) + '</span></td>' +
        '<td class="src" data-label="出典">' + src + '</td>' +
      '</tr>';
    });

    out.innerHTML = html + '</tbody></table>';
  }

  function buildChips() {
    LEVELS.forEach(function (lv) {
      var n = entries.filter(function (e) { return e.confidence === lv; }).length;
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.textContent = lv + ' (' + n + ')';
      b.addEventListener('click', function () {
        active[lv] = !active[lv];
        b.setAttribute('aria-pressed', active[lv] ? 'true' : 'false');
        active.on = LEVELS.some(function (l) { return active[l]; });
        render();
      });
      chipsEl.appendChild(b);
    });
  }

  qEl.addEventListener('input', render);

  fetch('glossary.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      entries = data.entries || [];
      // en/ja 未特定を後ろに寄せ、あとは英語のアルファベット順
      entries.sort(function (a, b) {
        var ax = (a.en && a.ja) ? 0 : 1, bx = (b.en && b.ja) ? 0 : 1;
        if (ax !== bx) return ax - bx;
        return (a.en || a.ja).localeCompare(b.en || b.ja, 'en');
      });
      var m = data.meta || {};
      var c = m.coverage || {};
      metaEl.innerHTML =
        'confirmed ' + (c.confirmed || 0) + ' / guess ' + (c.guess || 0) +
        ' / unmatched ' + (c.unmatched || 0) + ' — 全 ' + (c.total || 0) + ' 件' +
        (m.updated ? '（更新 ' + esc(m.updated) + '）' : '') +
        '<br>confirmed は <a href="https://www.prydwen.gg/chaos-zero-nightmare/"' +
        ' target="_blank" rel="noopener">Prydwen</a> のページで実際に使われている語のみ。';
      buildChips();
      render();
    })
    .catch(function (err) {
      out.innerHTML = '<p class="msg"><strong>glossary.json を読み込めませんでした</strong>' +
        '（' + esc(err.message) + '）。<br><br>' +
        'ファイルを直接開いた場合、ブラウザの制限で読み込めません。' +
        'リポジトリのルートで <code>python3 -m http.server</code> を実行し、' +
        '<code>http://localhost:8000/docs/</code> を開いてください。</p>';
      countEl.textContent = '';
    });
})();
</script>
</body>
</html>
