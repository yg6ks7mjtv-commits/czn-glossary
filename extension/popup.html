<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CZN 用語対応表</title>
<style>
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; width: 240px; padding: 12px; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  p.note { color: #666; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>CZN 用語対応表（開発用）</h1>
  <label>
    <input type="checkbox" id="toggle">
    このページで用語置換・効果文表示を有効にする
  </label>
  <p class="note">
    OFF にしても、既に置換済みのテキストは元に戻りません。
    反映にはページの再読み込みが必要です。
  </p>
  <hr>
  <label>
    <input type="checkbox" id="translateToggle">
    AI翻訳（実験的・Magnaのページのみ）
  </label>
  <p class="note">
    Chrome内蔵のTranslator APIで、カード領域以外の解説文を先に翻訳してから
    既存の用語置換を行う。既定はOFF。表示が崩れた場合の原因切り分けのため、
    ONと比較できるようにしている。反映にはページの再読み込みが必要です。
  </p>
</body>
<script src="popup.js"></script>
</html>
